<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&amp;display=swap');
      .mm-meal { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 132px; fill: #182B3A; letter-spacing: -2px; }
      .mm-mate { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 132px; fill: #2B8A3E; letter-spacing: -2px; }
      .mm-sub { font-family: 'Poppins', sans-serif; font-weight: 400; font-size: 27px; fill: #182B3A; letter-spacing: 5.5px; }
    </style>
  </defs>

  <!-- Green circular arc around right side -->
  <path d="M 412 132 A 168 168 0 0 1 564 316" fill="none" stroke="#2B8A3E" stroke-width="14" stroke-linecap="round"/>

  <!-- Steaming Cloche / Food Platter above laptop -->
  <g transform="translate(405, 162)">
    <!-- Steam waves -->
    <path d="M 52 52 C 44 38, 62 24, 52 8 C 64 22, 50 38, 58 52 Z" fill="#2B8A3E"/>
    <path d="M 73 45 C 63 28, 84 12, 72 -8 C 88 10, 71 28, 80 45 Z" fill="#2B8A3E"/>
    <path d="M 94 52 C 86 38, 104 24, 94 8 C 106 22, 92 38, 100 52 Z" fill="#2B8A3E"/>
    <!-- Cloche handle -->
    <ellipse cx="74" cy="62" rx="11" ry="8" fill="#2B8A3E"/>
    <!-- Cloche dome -->
    <path d="M 16 118 C 16 74, 42 64, 74 64 C 106 64, 132 74, 132 118 Z" fill="#2B8A3E"/>
    <!-- Dome highlight -->
    <path d="M 92 78 A 42 42 0 0 1 114 108" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <!-- Cloche base platter -->
    <rect x="6" y="122" width="136" height="14" rx="7" fill="#2B8A3E"/>
  </g>

  <!-- Person with Laptop -->
  <g>
    <!-- Head & Neck (Skin) -->
    <path d="M 296 226 L 378 176 L 392 198 L 386 218 L 395 232 L 386 240 L 381 262 C 378 272, 366 274, 354 270 L 336 264 L 332 288 L 288 266 Z" fill="#FAD09F"/>
    <!-- Hair (Dark Navy) -->
    <path d="M 302 214 C 296 184, 316 154, 344 150 C 356 140, 378 142, 392 156 C 402 158, 412 154, 416 148 C 418 164, 410 178, 400 182 C 410 184, 418 182, 421 178 C 420 194, 406 204, 388 202 C 378 200, 368 192, 360 198 C 354 202, 352 216, 346 220 C 342 210, 336 206, 330 212 C 325 218, 326 228, 330 232 C 322 234, 312 236, 306 238 C 304 228, 304 220, 302 214 Z" fill="#182B3A"/>
    <!-- Torso / T-Shirt (Dark Navy) -->
    <path d="M 218 332 C 228 282, 260 256, 292 254 C 306 274, 324 282, 338 272 C 358 284, 372 316, 384 368 L 426 364 L 426 392 L 352 406 L 266 390 C 242 382, 224 362, 218 332 Z" fill="#182B3A"/>
    <!-- Forearm & Hand typing (Skin) -->
    <path d="M 352 372 L 404 366 C 416 362, 428 352, 438 358 C 448 364, 452 376, 444 384 L 352 406 Z" fill="#FAD09F"/>
    <!-- White sleeve accent line -->
    <path d="M 306 368 L 352 368 L 352 406" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Green Leaves & Bottom Swoosh -->
  <g>
    <!-- Left larger leaf -->
    <path d="M 238 390 C 194 382, 182 342, 176 312 C 208 314, 244 338, 238 390 Z" fill="#2B8A3E"/>
    <!-- Right smaller leaf -->
    <path d="M 244 394 C 234 366, 248 342, 266 334 C 274 356, 268 382, 244 394 Z" fill="#2B8A3E"/>
    <!-- Leaf vein detail -->
    <path d="M 256 356 L 244 394" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Bottom green swoosh under person -->
    <path d="M 238 390 C 282 426, 362 432, 426 410 C 366 418, 298 410, 256 382 Z" fill="#2B8A3E"/>
  </g>

  <!-- Laptop (Dark Navy) -->
  <g>
    <path d="M 424 410 L 472 322 C 475 316, 482 314, 490 314 L 586 314 C 594 314, 598 318, 594 326 L 552 396 C 548 402, 542 404, 534 405 L 424 410 Z" fill="#182B3A"/>
    <!-- Laptop logo dot -->
    <circle cx="514" cy="360" r="8" fill="#ffffff"/>
  </g>

  <!-- Brand Text: MealMate -->
  <g transform="translate(400, 546)" text-anchor="middle">
    <text y="0">
      <tspan class="mm-meal">Meal</tspan><tspan class="mm-mate">Mate</tspan>
    </text>
  </g>

  <!-- Negative-space Fork inside the 'a' of Mate -->
  <g transform="translate(546, 514) rotate(36)">
    <!-- Fork handle -->
    <rect x="-4" y="6" width="8" height="36" rx="3" fill="#ffffff"/>
    <!-- Fork head base -->
    <path d="M -11 -6 C -11 4, 11 4, 11 -6 L 11 -10 L -11 -10 Z" fill="#ffffff"/>
    <!-- Fork tines -->
    <rect x="-11" y="-24" width="3.5" height="16" rx="1.5" fill="#ffffff"/>
    <rect x="-4.5" y="-24" width="3.5" height="16" rx="1.5" fill="#ffffff"/>
    <rect x="2" y="-24" width="3.5" height="16" rx="1.5" fill="#ffffff"/>
    <rect x="8" y="-24" width="3.5" height="16" rx="1.5" fill="#ffffff"/>
  </g>

  <!-- Tagline: — Your Meal Companion — -->
  <g transform="translate(400, 608)">
    <line x1="-260" y1="-9" x2="-212" y2="-9" stroke="#2B8A3E" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="0" text-anchor="middle" class="mm-sub">Your Meal Companion</text>
    <line x1="212" y1="-9" x2="260" y2="-9" stroke="#2B8A3E" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
